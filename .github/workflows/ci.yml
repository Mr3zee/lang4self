name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Identify Xcode toolchain
        id: toolchain
        run: echo "cache-key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM build cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .build
          key: swiftpm-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.resolved') }}
      - name: Check for private dictionary data
        run: ./scripts/check-public-data.sh
      - name: Run Swift tests
        run: swift test --parallel

  ui-tests:
    name: macOS UI tests (${{ matrix.shard_name }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_name: 1-of-4
          - shard_index: 1
            shard_name: 2-of-4
          - shard_index: 2
            shard_name: 3-of-4
          - shard_index: 3
            shard_name: 4-of-4
    env:
      UI_TEST_SHARD_COUNT: 4
      UI_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
    steps:
      - uses: actions/checkout@v5
      - name: Identify Xcode toolchain
        id: toolchain
        run: echo "cache-key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Xcode build cache
        id: xcode-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Lang4Self-*
          key: xcode-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Lang4Self.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Run UI tests
        run: |
          test_arguments=()
          test_index=0
          while IFS= read -r test_name; do
            if ((test_index % UI_TEST_SHARD_COUNT == UI_TEST_SHARD_INDEX)); then
              test_arguments+=("-only-testing:Lang4SelfUITests/Lang4SelfUITests/${test_name}")
            fi
            ((test_index += 1))
          done < <(sed -nE 's/^[[:space:]]+func (test[^ (]+)\(.*/\1/p' Tests/Lang4SelfUITests/Lang4SelfUITests.swift)

          xcodebuild -quiet \
            -project Lang4Self.xcodeproj \
            -scheme Lang4Self \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -resultBundlePath "TestResults-${{ matrix.shard_name }}.xcresult" \
            "${test_arguments[@]}" \
            test
      - name: Save Xcode build cache
        if: ${{ success() && steps.xcode-cache.outputs.cache-hit != 'true' && matrix.shard_index == 0 }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Lang4Self-*
          key: xcode-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Lang4Self.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macOS-ui-test-results-${{ matrix.shard_name }}
          path: TestResults-${{ matrix.shard_name }}.xcresult
          retention-days: 7
